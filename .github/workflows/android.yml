name: Build JSR Vlither Debug APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slang shader compiler
        run: |
          SLANG_VERSION="2024.14.3"

          wget -q \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" \
            -O slang.tar.gz

          if [ ! -s slang.tar.gz ]; then
            echo "ERROR: Slang download failed"
            exit 1
          fi

          tar -xzf slang.tar.gz

          SLANG_BIN=$(find . -type f -name "slangc" | head -n 1)

          if [ -z "$SLANG_BIN" ]; then
            echo "ERROR: slangc was not found"
            exit 1
          fi

          chmod +x "$SLANG_BIN"

          sudo ln -sf "$(realpath "$SLANG_BIN")" \
            /usr/local/bin/slangc

          slangc -v

      - name: Compile shaders
        run: |
          python3 build.py 2

      - name: Copy assets to Android project
        run: |
          ASSETS="android/app/src/main/assets"

          mkdir -p \
            "$ASSETS/shaders" \
            "$ASSETS/fonts" \
            "$ASSETS/textures"

          if [ ! -d "app/res/shaders/bin" ]; then
            echo "ERROR: Shader folder was not found"
            exit 1
          fi

          cp app/res/shaders/bin/*.spv \
            "$ASSETS/shaders/"

          if [ -d "app/res/fonts" ]; then
            cp app/res/fonts/*.ttf \
              "$ASSETS/fonts/" || true
          fi

          if [ -d "app/res/textures" ]; then
            cp -r app/res/textures/. \
              "$ASSETS/textures/"
          fi

          echo "Assets copied:"
          find "$ASSETS" -type f

      - name: Generate Gradle wrapper
        run: |
          cd android

          gradle wrapper \
            --gradle-version=8.6

          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd android

          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=26.3.11579264 \
            --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

      - name: Upload JSR Vlither Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JSR-Vlither-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30