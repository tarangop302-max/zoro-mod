name: Build JSR Vlither Debug APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          # The android-actions/setup-android action tries to install the
          # legacy "tools" package by default, which Google removed from
          # the SDK repository -- that always fails now. GitHub's ubuntu
          # runners already ship an Android SDK (usually at
          # /usr/local/lib/android/sdk), but without that action, its
          # cmdline-tools/*/bin directory is never added to PATH, so we
          # have to find it and export it ourselves before calling
          # sdkmanager directly.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_BIN="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -print -quit)")"

          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "::error::Could not locate sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "$SDKMANAGER_BIN" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER_BIN/sdkmanager" --licenses > /dev/null || true
          "$SDKMANAGER_BIN/sdkmanager" --install "platform-tools"

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slang shader compiler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Was pinned to a fixed SLANG_VERSION, which breaks the moment
          # that specific release/asset is no longer available on GitHub
          # (exactly what happened: v2024.14.3 -- the project has since
          # moved on to newer releases, e.g. v2026.x). Fetching whatever
          # the *latest* release actually is avoids ever needing to bump
          # this by hand again.
          #
          # Curl is split out from the grep pipeline (and authenticated
          # with GITHUB_TOKEN) so that: 1) we don't get silently rate
          # limited -- unauthenticated GitHub API calls share a 60/hour
          # limit across EVERY GitHub-hosted runner, which is trivial to
          # exhaust, while authenticated calls get 5000/hour; and 2) a
          # failed lookup prints the actual API response instead of the
          # old version, where a `set -e` pipeline failure aborted the
          # script *before* the "couldn't find asset" diagnostic below
          # could ever run, leaving nothing but a bare exit-code-1.
          API_RESPONSE=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/shader-slang/slang/releases/latest)

          ASSET_URL=$(echo "$API_RESPONSE" \
            | grep -o '"browser_download_url": *"[^"]*-linux-x86_64\.tar\.gz"' \
            | head -n 1 \
            | grep -o 'https://[^"]*' || true)

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: couldn't find a linux-x86_64 Slang release asset"
            echo "API response was:"
            echo "$API_RESPONSE"
            exit 1
          fi

          echo "Downloading: $ASSET_URL"

          wget -q "$ASSET_URL" -O slang.tar.gz

          if [ ! -s slang.tar.gz ]; then
            echo "ERROR: Slang download failed"
            exit 1
          fi

          tar -xzf slang.tar.gz

          SLANG_BIN=$(find . -type f -name "slangc" | head -n 1)

          if [ -z "$SLANG_BIN" ]; then
            echo "ERROR: slangc was not found. Extracted contents:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$SLANG_BIN"

          sudo ln -sf "$(realpath "$SLANG_BIN")" \
            /usr/local/bin/slangc

          slangc -v

      - name: Compile shaders
        run: |
          python3 build.py 2

      - name: Copy assets to Android project
        run: |
          ASSETS="android/app/src/main/assets"

          mkdir -p \
            "$ASSETS/shaders" \
            "$ASSETS/fonts" \
            "$ASSETS/textures"

          if [ ! -d "app/res/shaders/bin" ]; then
            echo "ERROR: Shader folder was not found"
            exit 1
          fi

          cp app/res/shaders/bin/*.spv \
            "$ASSETS/shaders/"

          if [ -d "app/res/fonts" ]; then
            cp app/res/fonts/*.ttf \
              "$ASSETS/fonts/" || true
          fi

          if [ -d "app/res/textures" ]; then
            cp -r app/res/textures/. \
              "$ASSETS/textures/"
          fi

          echo "Assets copied:"
          find "$ASSETS" -type f

      - name: Generate Gradle wrapper
        run: |
          cd android

          gradle wrapper \
            --gradle-version=8.6

          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd android

          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=26.3.11579264 \
            --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

      - name: Upload JSR Vlither Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JSR-Vlither-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          overwrite: true