plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vlither'
    compileSdk 34

    defaultConfig {
        applicationId "com.vlither"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "2.5.7"
    }

    signingConfigs {
        debug {
            // A fixed, committed keystore -- NOT Gradle's
            // auto-generated one. Every CI build signs with
            // this same key, so new builds can be installed
            // as an UPDATE over the old app instead of
            // forcing an uninstall (which wipes settings).
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            )
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"
}