plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Single place to bump the app version. It must MATCH the tag of the release
// you upload (tag v1.3  ->  appVersion = "1.3"), otherwise the app would keep
// showing NEW UPDATE after updating.
//   - versionName / BuildConfig.VERSION_NAME: shown on the first screen and
//     compared against the newest GitHub Release tag
//   - APP_VERSION in the native code (passed to CMake below)
// versionCode is minutes-since-1970, so every build is always accepted by
// Android as an upgrade, even over test builds with a bigger number.
// ---------------------------------------------------------------------------
def appVersion = "1.2"
def appVersionCode = (int) (System.currentTimeMillis() / 60000L)

android {
    namespace 'com.vlither'
    compileSdk 34

    defaultConfig {
        applicationId "com.vlither"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion

        externalNativeBuild {
            cmake {
                arguments "-DAPP_VERSION_NAME=${appVersion}"
            }
        }
    }

    signingConfigs {
        debug {
            // A fixed, committed keystore -- NOT Gradle's
            // auto-generated one. Every CI build signs with
            // this same key, so new builds can be installed
            // as an UPDATE over the old app instead of
            // forcing an uninstall (which wipes settings).
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            )
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.20"
    implementation "androidx.core:core:1.13.1"
}